{% extends "base.html" %}
{% block title %}Login | CampusMart{% endblock %}
{% block content %}
<section class="form-wrap">
    <div class="form-intro">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Log in to CampusMart</h1>
        <p>Sign in to list items or contact sellers.</p>
    </div>
    <form method="POST" class="form-card">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
        <button class="button full-width" type="submit">Log in</button>
        <p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </form>
</section>
{% endblock %}
