{% extends "base.html" %}
{% block title %}Sell an item | CampusMart{% endblock %}

{% block content %}
<section class="form-wrap wide-form">
    <div class="form-intro">
        <p class="eyebrow">MAKE A LISTING</p>
        <h1>Sell an item</h1>
        <p>Share a useful item with another student.</p>
    </div>

    <form method="POST"
          class="form-card"
          enctype="multipart/form-data">

        <label for="name">Item name</label>
        <input id="name" name="name" maxlength="100"
               required placeholder="e.g. Mathematics textbook">

        <div class="two-col">
            <div>
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Choose a category</option>
                    {% for category in categories %}
                    <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="price">Price (₹)</label>
                <input id="price" name="price" type="number"
                       min="0" step="0.01" required placeholder="200">
            </div>
        </div>

        <label for="condition">Condition</label>
        <select id="condition" name="condition" required>
            <option value="">Choose condition</option>
            {% for condition in conditions %}
            <option value="{{ condition }}">{{ condition }}</option>
            {% endfor %}
        </select>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4"
                  maxlength="1000" required
                  placeholder="Describe the item's condition and details."></textarea>

        <label for="photo">Upload item photo</label>
        <input id="photo" name="photo" type="file"
               accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp">

        <p class="help-text">
            Optional. JPG, JPEG, PNG, GIF or WEBP. Maximum size: 5 MB.
        </p>

        <div id="preview-container" hidden>
            <p>Photo preview:</p>
            <img id="photo-preview" src="" alt="Selected item photo preview">
            <button type="button" id="remove-photo" class="button">
                Remove photo
            </button>
        </div>

        <button class="button full-width" type="submit">
            Publish listing
        </button>
    </form>
</section>
{% endblock %}
