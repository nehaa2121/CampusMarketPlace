{% extends "base.html" %}
{% block title %}Create account | CampusMart{% endblock %}
{% block content %}
<section class="form-wrap">
    <div class="form-intro">
        <p class="eyebrow">JOIN THE CAMPUS COMMUNITY</p>
        <h1>Create your account</h1>
        <p>Join CampusMart to buy and sell useful college items.</p>
    </div>
    <form method="POST" class="form-card">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" maxlength="80" required autocomplete="name" placeholder="Your name">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="150" required autocomplete="email" placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
        <button class="button full-width" type="submit">Create account</button>
        <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
</section>
{% endblock %}
