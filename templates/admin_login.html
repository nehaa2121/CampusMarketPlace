{% extends "base.html" %}

{% block title %}Admin Login | CampusMart{% endblock %}

{% block content %}
<section class="admin-login-page">
    <div class="admin-login-card">

        <div class="admin-icon">🔐</div>

        <p class="eyebrow">CAMPUSMART MANAGEMENT</p>
        <h1>Admin Login</h1>

        <p class="admin-subtitle">
            Sign in to manage the campus marketplace.
        </p>

        <form method="POST" class="admin-login-form">

            <label for="email">Admin email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="username"
                placeholder="admin@campusmart.com"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="Enter admin password"
            >

            <button type="submit" class="button full-width">
                Login to dashboard
            </button>

        </form>

        <a class="back-link" href="{{ url_for('index') }}">
            ← Back to marketplace
        </a>

    </div>
</section>
{% endblock %}
